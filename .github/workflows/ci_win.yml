name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    # 這裡使用變數，會自動跑三個獨立的 job
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # 定義您想要測試的作業系統清單
        os: [windows-latest]
        # 您甚至可以同時測試多個 Python 版本
        python-version: ['3.10', '3.11']
  
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

  
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run tests
      run: |
        $env:PYTHONPATH="."
        pytest -q  